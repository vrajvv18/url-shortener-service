services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: urlshortener
      POSTGRES_USER: urluser
      POSTGRES_PASSWORD: urlpass
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U urluser -d urlshortener"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - urlshortener-data:/var/lib/postgresql/data

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/urlshortener
      DB_USERNAME: urluser
      DB_PASSWORD: urlpass
      PUBLIC_BASE_URL: http://localhost:8080
    ports:
      - "8080:8080"

volumes:
  urlshortener-data:
