spring:
  application:
    name: url-shortener
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/urlshortener}
    username: ${DB_USERNAME:urluser}
    password: ${DB_PASSWORD:urlpass}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    validate-on-migrate: true
    # Allows an existing non-empty database (for example, a developer DB created
    # by the previous version) to be adopted by Flyway without failing startup.
    # Fresh databases still execute V1__create_schema.sql normally.
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: existing-url-shortener-schema
  jackson:
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}
  error:
    include-message: never

app:
  public-url:
    base-url: ${PUBLIC_BASE_URL:http://localhost:8080}
  rate-limit:
    capacity: ${RATE_LIMIT_CAPACITY:30}
    window-seconds: ${RATE_LIMIT_WINDOW_SECONDS:60}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html
